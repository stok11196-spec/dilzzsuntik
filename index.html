<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DILZZ SUNTIK ELITE</title>
<style>:root{--bg:#0a0a0f;--card:#14141c;--line:#262633;--gold:#f5c542;--gold2:#ff9d2e;--tx:#f2f2f7;--mu:#8b8b9e;--ok:#2ecc71;--no:#ff4d5e;--pr:#3aa0ff}*{box-sizing:border-box;margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif}body{background:radial-gradient(circle at 50% -10%,#2a2108 0,var(--bg) 55%);color:var(--tx);min-height:100vh;padding-bottom:80px}.wrap{max-width:820px;margin:auto;padding:16px}header{display:flex;justify-content:space-between;align-items:center;padding:14px 0}.logo{font-weight:900;font-size:20px;letter-spacing:1px;background:linear-gradient(90deg,var(--gold),var(--gold2));-webkit-background-clip:text;color:transparent}.hero{text-align:center;padding:28px 10px}.hero h1{font-size:34px;font-weight:900}.hero h1 span{background:linear-gradient(90deg,var(--gold),var(--gold2));-webkit-background-clip:text;color:transparent}.hero p{color:var(--mu);margin-top:10px}.stats{display:flex;gap:10px;margin:18px 0}.stats div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}.stats b{display:block;color:var(--gold);font-size:18px}.stats small{color:var(--mu)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;transition:.2s}.card:hover{border-color:var(--gold);transform:translateY(-3px)}.ic{font-size:30px}.card h3{margin:8px 0 4px}.card p{color:var(--mu);font-size:13px;margin-bottom:10px}.price{color:var(--gold);font-weight:800;margin-bottom:10px}.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer;color:#111;background:linear-gradient(90deg,var(--gold),var(--gold2));width:100%;font-size:14px}.btn.s{background:#23232f;color:var(--tx);width:auto;padding:8px 12px;font-size:12px}.btn.g{background:var(--ok);color:#fff}.btn.r{background:var(--no);color:#fff}input,select,textarea{width:100%;background:#0e0e15;border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--tx);font-size:14px;margin:6px 0 12px}label{font-size:12px;color:var(--mu)}nav{position:fixed;bottom:0;left:0;right:0;background:#101018ee;backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:center;gap:6px;padding:8px}nav button{flex:1;max-width:200px;background:none;border:0;color:var(--mu);padding:8px;font-weight:700;cursor:pointer;border-radius:10px}nav button.on{color:#111;background:linear-gradient(90deg,var(--gold),var(--gold2))}.ov{position:fixed;inset:0;background:#000b;display:flex;align-items:flex-end;justify-content:center;z-index:9;overflow:auto}.md{background:var(--card);border:1px solid var(--line);border-radius:20px 20px 0 0;padding:20px;width:100%;max-width:520px;max-height:92vh;overflow:auto}.tot{background:#1d1708;border:1px dashed var(--gold);border-radius:12px;padding:12px;text-align:center;color:var(--gold);font-weight:900;font-size:20px;margin-bottom:12px}.badge{display:inline-block;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:800}.b0{background:#4a3a0a;color:var(--gold)}.b1{background:#0d2f4d;color:var(--pr)}.b2{background:#0d3a22;color:var(--ok)}.b3{background:#4a1219;color:var(--no)}.q{font-size:28px;font-weight:900;color:var(--gold)}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.o{margin-bottom:12px}.o small{color:var(--mu)}.o .lk{word-break:break-all;font-size:13px;color:var(--pr);margin:6px 0}.qr{display:block;margin:10px auto;max-width:220px;width:100%;border-radius:12px;background:#fff}.chat{background:#0e0e15;border:1px solid var(--line);border-radius:14px;padding:10px;height:320px;overflow:auto;margin-bottom:10px}.m{max-width:80%;padding:8px 12px;border-radius:14px;margin:6px 0;font-size:14px;word-break:break-word}.m.me{background:linear-gradient(90deg,var(--gold),var(--gold2));color:#111;margin-left:auto}.m.ot{background:#23232f}.m img{max-width:100%;border-radius:8px;margin-top:6px;display:block}.tabs{display:flex;gap:6px;margin:12px 0}.tabs button{flex:1;padding:10px;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:10px;font-weight:700;cursor:pointer}.tabs button.on{border-color:var(--gold);color:var(--gold)}.note{color:var(--mu);font-size:12px;text-align:center;margin-top:20px}.thread{cursor:pointer;padding:10px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--card)}.thread.on{border-color:var(--gold)}.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--gold);color:#111;font-weight:800;padding:10px 18px;border-radius:99px;z-index:99}</style></head><body>
<div class="wrap" id="app"></div>
<nav id="nav"></nav>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// k = harga modal Fayupedia per 1000 (Rp), f = ID layanan di Fayupedia, m = minimal order
const SERVICES=[
{id:'wa',ic:'📢',n:'Suntik Saluran WhatsApp',d:'Member saluran WA cepat',k:4185,f:1805,m:60,u:'pengikut'},
{id:'ttf',ic:'🎵',n:'Pengikut TikTok',d:'Followers TikTok stabil',k:15155,f:1843,m:60,u:'pengikut'},
{id:'igf',ic:'📸',n:'Pengikut Instagram',d:'Followers Instagram real quality',k:13467,f:1840,m:60,u:'pengikut'},
{id:'ttv',ic:'▶️',n:'Views TikTok',d:'Tayangan video TikTok',k:64,f:1631,m:100,u:'views'},
{id:'igv',ic:'🎬',n:'Views Instagram',d:'Tayangan reels/video IG',k:33,f:1235,m:60,u:'views'},
{id:'ttl',ic:'❤️',n:'Like TikTok',d:'Like video TikTok',k:17795,f:195,m:60,u:'like'},
{id:'igl',ic:'💖',n:'Like Instagram',d:'Like postingan IG',k:1758,f:1842,m:60,u:'like'}
];
// Untung: modal x MARKUP + FLAT, dibulatkan ke atas per 100 perak. Ubah di sini.
const MARKUP=1.5, FLAT=100, ADMIN_PW='admin123';
const modalOf=(s,q)=>Math.round(q*s.k/1000);
const priceOf=(s,q)=>Math.ceil((q*s.k/1000*MARKUP+FLAT)/100)*100;
const FIREBASE_CONFIG={apiKey:"AIzaSyBXZ6S9CTX1MDC-WB7XTiu9mZG-l3xDlTw",authDomain:"dilzz-57e8d.firebaseapp.com",projectId:"dilzz-57e8d",appId:"1:847141320647:web:8bd2190bd829367f978be2"};
const ADMIN_EMAIL="stok11196@gmail.com";   // email admin yang kamu buat di Firebase Authentication
const LIVE=!!(FIREBASE_CONFIG.apiKey&&window.firebase);
let ready=!LIVE,fs,au,unsubs=[],seen=false;
const K='suntikelite_v1';
let db;if(!LIVE){try{db=JSON.parse(localStorage.getItem(K))}catch(e){}}
db=db||{orders:[],chats:[],counter:0,qris:''};
const save=()=>{if(LIVE)return;try{localStorage.setItem(K,JSON.stringify(db))}catch(e){toast('Penyimpanan penuh')}};
let uid;try{uid=localStorage.getItem('se_uid');if(!uid){uid='u'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);localStorage.setItem('se_uid',uid)}}catch(e){uid='u0'}
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp=n=>'Rp'+Number(n).toLocaleString('id-ID');
const ST=['Belum diproses','Proses','Berhasil','Ditolak'];
let tab='home',modal='',cur=null,adminTab='orders',thread=null,isAdmin=false;
if(!LIVE)try{isAdmin=sessionStorage.getItem('se_admin')==='1'}catch(e){}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2000)}
function img(file,cb){if(!file)return;const r=new FileReader();r.onerror=()=>toast('Foto gagal dibaca');r.onload=()=>{const i=new Image();i.onerror=()=>toast('Format foto tidak didukung, pakai JPG/PNG');i.onload=()=>{const k=Math.min(1,800/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.7))};i.src=r.result};r.readAsDataURL(file)}
const isAdm=()=>location.hash==='#admin';
window.onhashchange=()=>render();
function render(){
if(!ready){$('#app').innerHTML='<p class="note" style="margin-top:90px">Menghubungkan…</p>';return}
if(isAdm()){$('#nav').innerHTML='';return isAdmin?adminView():loginView()}
$('#nav').innerHTML=[['home','🏠 Layanan'],['orders','📋 Pesanan'],['cs','💬 Customer']].map(([k,l])=>`<button class="${tab==k?'on':''}" onclick="tab='${k}';render()">${l}</button>`).join('');
const h=`<header><div class="logo">⚡ DILZZ SUNTIK ELITE</div><span class="badge b2">● Online 24 Jam</span></header>`;
$('#app').innerHTML=h+(tab=='home'?home():tab=='orders'?orders():cs())+`<p class="note">© DILZZ SUNTIK ELITE · <a href="#admin" style="color:var(--mu)" onclick="setTimeout(render,0)">Admin</a></p>`+modal;
if(tab=='cs'||modal.includes('chat')){const c=$('.chat');if(c)c.scrollTop=1e9}
}
function home(){return `<div class="hero"><h1>Naikin Sosmed Kamu Jadi <span>ELITE</span></h1><p>Suntik pengikut, views & like. Murah, cepat, aman.</p></div>
<div class="stats"><div><b>${db.orders.filter(o=>o.st==2).length+1200}+</b><small>Order Sukses</small></div><div><b>24/7</b><small>Layanan</small></div><div><b>100%</b><small>Aman</small></div></div>
<div class="grid">${SERVICES.map(s=>`<div class="card"><div class="ic">${s.ic}</div><h3>${s.n}</h3><p>${s.d}</p><div class="price">Mulai ${rp(priceOf(s,s.m))} · min ${s.m} ${s.u}</div><button class="btn" onclick="openOrder('${s.id}')">Klik Pesan Paket</button></div>`).join('')}</div>`}
function openOrder(id){cur=SERVICES.find(s=>s.id==id);modal=`<div class="ov"><div class="md"><h2>${cur.ic} ${cur.n}</h2><br>
<label>Jumlah ${cur.u} (minimal ${cur.m})</label><input id="jm" type="number" min="${cur.m}" placeholder="Min ${cur.m}" oninput="hit()">
<p id="wr" style="color:var(--no);font-size:12px;margin:-6px 0 8px"></p>
<div class="tot" id="tt">Rp0</div>
<label>Nama</label><input id="nm" placeholder="Nama kamu">
<label>Tautan / Link</label><input id="lk" placeholder="https://...">
<button class="btn" onclick="toPay()">Konfirmasi</button><br><br><button class="btn s" onclick="modal='';render()">Batal</button></div></div>`;render()}
function hit(){const j=+$('#jm').value||0;$('#wr').textContent=j&&j<cur.m?'⚠️ Minimal pesan '+cur.m+' '+cur.u+', di bawah itu tidak bisa.':'';$('#tt').textContent=j>=cur.m?rp(priceOf(cur,j)):'Rp0'}
let draft=null;
function toPay(){const j=+$('#jm').value,nm=$('#nm').value.trim(),lk=$('#lk').value.trim();
if(!j||j<cur.m)return toast('Minimal '+cur.m+' '+cur.u+', tidak bisa di bawah itu');if(!nm)return toast('Nama wajib diisi');if(!lk)return toast('Tautan wajib diisi');
draft={sid:cur.id,svc:cur.n,fid:cur.f,modal:modalOf(cur,j),jml:j,total:priceOf(cur,j),nama:nm,link:lk,bukti:''};
modal=`<div class="ov"><div class="md"><h2>💳 Pembayaran</h2><div class="tot">${rp(draft.total)}</div>
${db.qris?`<img class="qr" src="${db.qris}">`:`<p class="note">QR belum diatur admin. Hubungi Customer.</p>`}
<p class="note">Scan QR, bayar sesuai total, lalu upload screenshot bukti transfer.</p><br>
<label>Bukti Transfer (wajib)</label><input type="file" accept="image/*" onchange="img(this.files[0],d=>{draft.bukti=d;toast('Bukti terpilih')})">
<button class="btn" onclick="done()">Konfirmasi</button><br><br><button class="btn s" onclick="modal='';render()">Batal</button></div></div>`;render()}
async function done(){if(!draft.bukti)return toast('Upload bukti transfer dulu');
let o;
if(LIVE){try{await fs.runTransaction(async t=>{const r=fs.doc('meta/counter'),d=await t.get(r),n=(d.exists?d.data().n:0)+1;o={...draft,id:n,no:'A'+String(n).padStart(4,'0'),uid,st:0,t:Date.now()};t.set(r,{n});t.set(fs.doc('orders/'+n),o)})}catch(e){return toast('Gagal kirim pesanan: '+(e.code||e.message))}}
else{db.counter++;o={...draft,id:db.counter,no:'A'+String(db.counter).padStart(4,'0'),uid,st:0,t:Date.now()};db.orders.push(o);save()}
modal=`<div class="ov"><div class="md" style="text-align:center"><h2>✅ Pesanan Masuk</h2><p class="note">Nomor antrian kamu</p><div class="q" style="font-size:44px">${o.no}</div><p class="note">Status: Belum diproses. Cek di menu Pesanan.</p><br><button class="btn" onclick="modal='';tab='orders';render()">Lihat Pesanan</button></div></div>`;render()}
function oCard(o,adm){return `<div class="card o"><div class="row"><div class="q">${o.no}</div><span class="badge b${o.st}">${ST[o.st]}</span></div>
<b>${esc(o.svc)}</b> · ${o.jml} · ${rp(o.total)}<br><small>${esc(o.nama)} · ${new Date(o.t).toLocaleString('id-ID')}</small>
<div class="lk">${esc(o.link)}</div>
${adm?`<small>Fayupedia ID #${o.fid} · modal ${rp(o.modal)} · untung ${rp(o.total-o.modal)}</small><div class="row" style="margin-top:8px"><button class="btn s" onclick="cp(${o.id})">📋 Salin Tautan</button><button class="btn s" onclick="showBukti(${o.id})">🧾 Bukti</button></div><br>
<div class="row">${[1,2,3].map(s=>`<button class="btn s ${s==2?'g':s==3?'r':''}" onclick="setSt(${o.id},${s})">${ST[s]}</button>`).join('')}<button class="btn s" onclick="setSt(${o.id},0)">Reset</button></div>`:''}</div>`}
function orders(){const mine=db.orders.filter(o=>o.uid==uid).reverse();
return `<h2>📋 Pesanan Saya</h2><br><label>Cek dengan nomor antrian</label><div class="row"><input id="sq" placeholder="A0001" style="flex:1"><button class="btn s" onclick="srch()">Cari</button></div><div id="sr"></div>
${mine.length?mine.map(o=>oCard(o)).join(''):'<p class="note">Belum ada pesanan.</p>'}`}
function srch(){const v=$('#sq').value.trim().toUpperCase(),o=db.orders.find(x=>x.no==v);$('#sr').innerHTML=o?oCard(o):'<p class="note">Tidak ditemukan</p>'}
function cp(id){const o=db.orders.find(x=>x.id==id);navigator.clipboard.writeText(o.link).then(()=>toast('Tautan disalin'),()=>{prompt('Salin:',o.link)})}
function setSt(id,s){if(LIVE)return fs.doc('orders/'+id).update({st:s}).catch(e=>toast('Gagal: '+(e.code||e.message)));db.orders.find(x=>x.id==id).st=s;save();render()}
function showBukti(id){const o=db.orders.find(x=>x.id==id);modal=`<div class="ov"><div class="md"><img class="qr" style="max-width:100%" src="${o.bukti}"><br><button class="btn s" onclick="modal='';render()">Tutup</button></div></div>`;render()}
function msgs(list,me){return list.map(m=>`<div class="m ${m.from==me?'me':'ot'}">${esc(m.text)}${m.img?`<img src="${m.img}">`:''}</div>`).join('')||'<p class="note">Belum ada pesan</p>'}
let pimg='';
function cs(){return `<h2>💬 Customer Service</h2><p class="note" style="text-align:left;margin:6px 0 12px">Ada masalah? Kirim pesan + foto, admin akan membalas.</p>
<div class="chat" id="cm">${msgs(db.chats.filter(m=>m.uid==uid),'b')}</div>${chatBox('b')}`}
function chatBox(me){return `<div id="pv"></div><input id="ct" placeholder="Tulis pesan..." onkeydown="if(event.key==='Enter'){event.preventDefault();send('${me}')}">
<div class="row"><button type="button" class="btn s" style="margin:0" onclick="document.getElementById('cf').click()">📷 Foto</button><input id="cf" type="file" accept="image/*" onchange="pick(this)" style="position:absolute;left:-9999px;top:0;width:1px;height:1px;opacity:0"><button type="button" class="btn" style="flex:1;width:auto" onclick="send('${me}')">Kirim ➤</button></div>`}
function pick(el){const f=el.files&&el.files[0];if(!f)return;img(f,d=>{pimg=d;$('#pv').innerHTML=`<div class="m me" style="margin:0 0 8px">Foto siap dikirim<img src="${d}" style="max-width:120px"></div>`;toast('Foto terpilih')});el.value=''}
function send(me){try{
const ct=$('#ct'),t=ct.value.trim();
if(!t&&!pimg)return toast('Tulis pesan atau pilih foto');
const u=me=='b'?uid:thread;if(!u)return toast('Pilih chat dulu');
const msg={uid:u,from:me,text:t,img:pimg,t:Date.now()};if(LIVE)fs.collection('chats').add(msg).catch(e=>toast('Gagal kirim: '+(e.code||e.message)));else db.chats.push(msg);pimg='';
ct.value='';$('#pv').innerHTML='';
const m=$('#cm');m.innerHTML=msgs(db.chats.filter(x=>x.uid==u),me=='b'?'b':'a');m.scrollTop=m.scrollHeight;
save();toast('Terkirim')}catch(e){toast('Gagal kirim: '+e.message)}}
function loginView(){$('#app').innerHTML=`<div class="hero"><div class="logo" style="font-size:30px">⚡ ADMIN LOGIN</div></div><div class="card">${LIVE?'<label>Email admin</label><input id="em" type="email">':''}<label>Password</label><input id="pw" type="password"><button class="btn" onclick="login()">Masuk</button><br><br><a href="#admin" style="color:var(--gold);font-size:13px" onclick="forgot();return false">Lupa password? Reset</a></div>`}
const pw=()=>{try{return localStorage.getItem('se_pw')||ADMIN_PW}catch(e){return ADMIN_PW}};
function forgot(){if(LIVE){const e=(($('#em')||{}).value||ADMIN_EMAIL).trim();if(!e)return toast('Isi email admin dulu');au.sendPasswordResetEmail(e).then(()=>toast('Link reset dikirim ke email admin'),x=>toast('Gagal: '+(x.code||x.message)))}else toast('Mode lokal: pakai password bawaan di kode (ADMIN_PW)')}
function chpw(){const n=$('#np').value;if(n.length<6)return toast('Minimal 6 karakter');if(LIVE){au.currentUser.updatePassword(n).then(()=>{toast('Password diganti');$('#np').value=''},e=>toast(e.code=='auth/requires-recent-login'?'Keluar lalu login ulang, coba lagi':'Gagal: '+(e.code||e.message)))}else{if($('#op').value!==pw())return toast('Password lama salah');try{localStorage.setItem('se_pw',n)}catch(e){}toast('Password diganti');$('#np').value=$('#op').value=''}}
function login(){if(LIVE){au.signInWithEmailAndPassword($('#em').value.trim(),$('#pw').value).then(()=>{if(!isAdmin)toast('Email ini bukan admin')},e=>toast('Login gagal: '+(e.code||e.message)));return}if($('#pw').value==pw()){isAdmin=true;try{sessionStorage.setItem('se_admin','1')}catch(e){}render()}else toast('Password salah')}
function adminView(){
const c=[0,1,2,3].map(s=>db.orders.filter(o=>o.st==s).length);
let body='';
if(adminTab=='orders')body=db.orders.slice().reverse().map(o=>oCard(o,1)).join('')||'<p class="note">Belum ada pesanan</p>';
else if(adminTab=='chat'){const us=[...new Set(db.chats.map(m=>m.uid))];
const nm=u=>{const o=db.orders.find(x=>x.uid==u);return o?o.nama:'Pembeli '+u.slice(-4)};
body=us.map(u=>`<div class="thread ${thread==u?'on':''}" onclick="thread='${u}';render()">👤 ${esc(nm(u))}</div>`).join('')||'<p class="note">Belum ada chat</p>';
if(thread)body+=`<div class="chat" id="cm">${msgs(db.chats.filter(m=>m.uid==thread),'a')}</div>${chatBox('a')}`}
else body=`<div class="card"><label>Upload QR pembayaran (QRIS)</label><input type="file" accept="image/*" onchange="img(this.files[0],d=>setQris(d))">${db.qris?`<img class="qr" src="${db.qris}">`:''}<br><label>Ganti password</label>${LIVE?'':'<input id="op" type="password" placeholder="Password lama">'}<input id="np" type="password" placeholder="Password baru (min 6)"><button class="btn" onclick="chpw()">Simpan Password</button><br><br><button class="btn s r" onclick="logout()">Keluar</button></div>`;
$('#app').innerHTML=`<header><div class="logo">⚡ ADMIN PANEL</div><span class="badge b2">DILZZ SUNTIK ELITE</span></header>
${LIVE?'':'<p class="note" style="margin-bottom:10px">⚠️ Mode lokal: data belum online. Isi FIREBASE_CONFIG supaya pesanan dari semua orang masuk ke sini.</p>'}<div class="stats"><div><b>${c[0]}</b><small>Belum</small></div><div><b>${c[1]}</b><small>Proses</small></div><div><b>${c[2]}</b><small>Berhasil</small></div><div><b>${c[3]}</b><small>Ditolak</small></div></div>
<div class="tabs">${[['orders','Pesanan'],['chat','Customer'],['set','Pengaturan']].map(([k,l])=>`<button class="${adminTab==k?'on':''}" onclick="adminTab='${k}';render()">${l}</button>`).join('')}</div>${body}${modal}`}
function logout(){if(LIVE){au.signOut();location.hash='';return}isAdmin=false;try{sessionStorage.removeItem('se_admin')}catch(e){}location.hash='';render()}
function setQris(d){db.qris=d;save();if(LIVE)fs.doc('settings/main').set({qris:d}).then(()=>toast('QR tersimpan'),e=>toast('Gagal: '+(e.code||e.message)));render()}
function refresh(){const a=document.activeElement,typing=a&&(a.tagName=='INPUT'||a.tagName=='TEXTAREA');
const m=$('#cm');if(m){const u=isAdm()?thread:uid;m.innerHTML=msgs(db.chats.filter(x=>x.uid==u),isAdm()?'a':'b');m.scrollTop=m.scrollHeight}
if(!typing&&!modal&&!pimg)render()}
function listen(){unsubs.forEach(f=>f());unsubs=[];seen=false;
const oc=isAdmin?fs.collection('orders'):fs.collection('orders').where('uid','==',uid);
const cc=isAdmin?fs.collection('chats'):fs.collection('chats').where('uid','==',uid);
unsubs.push(fs.doc('settings/main').onSnapshot(d=>{db.qris=(d.data()||{}).qris||'';refresh()},()=>{}));
unsubs.push(oc.onSnapshot(q=>{db.orders=q.docs.map(d=>d.data()).sort((x,y)=>x.id-y.id);if(isAdmin&&seen&&q.docChanges().some(c=>c.type=='added'))toast('🔔 Pesanan baru masuk!');seen=true;refresh()},e=>toast('Gagal ambil pesanan: '+e.code)));
unsubs.push(cc.onSnapshot(q=>{db.chats=q.docs.map(d=>d.data()).sort((x,y)=>x.t-y.t);refresh()},e=>toast('Gagal ambil chat: '+e.code)))}
function initFB(){firebase.initializeApp(FIREBASE_CONFIG);au=firebase.auth();fs=firebase.firestore();
au.onAuthStateChanged(u=>{if(!u){au.signInAnonymously().catch(e=>{ready=true;toast('Gagal konek: '+(e.code||e.message));render()});return}
uid=u.uid;isAdmin=!!u.email&&!!ADMIN_EMAIL&&u.email.toLowerCase()===ADMIN_EMAIL.toLowerCase();ready=true;listen();render()})}
if(LIVE){try{initFB()}catch(e){ready=true;toast('Firebase error: '+e.message);render()}}else render();
</script></body></html>
