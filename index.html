try{const a=document.createElement('a');a.href=db.qris;a.download='QRIS-DILZZ.jpg';document.body.appendChild(a);a.click();a.remove();toast('QR diunduh. Cek galeri/unduhan')}catch(e){toast('Tekan lama gambar QR lalu Simpan')}}
function zoomQr(){if(!db.qris)return;const o=document.createElement('div');o.className='ov';o.style.cssText='z-index:30;align-items:center;flex-direction:column;gap:12px;padding:16px';o.innerHTML=`<img src="${esc(db.qris)}" style="max-width:92vw;max-height:70vh;background:#fff;border-radius:12px"><p class="note" style="margin:0;color:#ddd">Tekan lama gambar untuk simpan, atau klik Download</p><div class="row"><button class="btn" style="width:auto" onclick="dlQr()">⬇️ Download QR</button><button class="btn s" onclick="this.closest('.ov').remove()">Tutup</button></div>`;document.body.appendChild(o)}
function toPay(){const j=Math.floor(+$('#jm').value),nm=$('#nm').value.trim(),lk=$('#lk').value.trim();
if(!j)return toast('Isi jumlah dulu');const e=chk(j);if(e)return toast(e.replace('⚠️ ',''));if(!nm)return toast('Nama wajib diisi');if(!lk)return toast('Tautan wajib diisi');
draft={sid:cur.id,svc:cur.n,fid:cur.f,modal:modalOf(cur,j),jml:j,total:priceOf(cur,j),nama:nm,link:lk,bukti:''};
modal=payModal();render()}
async function done(){if(sending)return;if(!draft.bukti)return toast('Upload bukti transfer dulu');sending=true;
let o;
if(LIVE){try{await fs.runTransaction(async t=>{const r=fs.doc('meta/counter'),d=await t.get(r),n=(d.exists?d.data().n:0)+1;o={...draft,id:n,no:'A'+String(n).padStart(4,'0'),uid,st:0,t:Date.now()};t.set(r,{n});t.set(fs.doc('orders/'+n),o)})}catch(e){sending=false;return toast('Gagal kirim pesanan: '+(e.code||e.message))}}
else{db.counter++;o={...draft,id:db.counter,no:'A'+String(db.counter).padStart(4,'0'),uid,st:0,t:Date.now()};db.orders.push(o);save()}
if(LIVE)fs.collection('feed').doc(String(o.id)).set({no:o.no,nama:mask(o.nama),svc:o.svc,jml:o.jml,st:0,p:o.prod?1:0,t:o.t}).catch(()=>{});
sending=false;draft=null;
hl=o.no;modal=`<div class="ov"><div class="md" style="text-align:center"><h2>✅ Pesanan Masuk</h2><p class="note">Nomor antrian kamu</p><div class="q" style="font-size:44px">${o.no}</div><p class="note">Status: Belum diproses. Pesananmu sudah masuk Antrian Publik.</p><br><button class="btn" onclick="modal='';tab='queue';render()">Lihat Antrian</button><br><br><button class="btn s" onclick="modal='';goMine('${o.no}')">Antrian Saya</button></div></div>`;render()}
function oCard(o,adm){return `<div class="card o"><div class="row"><div class="q">${esc(o.no)}</div><span class="badge b${o.st}">${ST[o.st]}</span></div>
<b>${esc(o.svc)}</b> · ${o.jml} · ${rp(o.total)}<br><small>${esc(o.nama)} · ${new Date(o.t).toLocaleString('id-ID')}</small>
<div class="lk">${esc(o.link)}</div>
${adm?`<small>${o.prod?'📦 Produk · '+rp(o.total):'ID #'+o.fid+' · modal '+rp(o.modal)+' · untung '+rp(o.total-o.modal)}</small><div class="row" style="margin-top:8px"><button class="btn s" onclick="cp(${o.id})">📋 Salin Tautan</button><button class="btn s" onclick="showBukti(${o.id})">🧾 Bukti</button></div><br>
<div class="row">${[1,2,3].map(s=>`<button class="btn s ${s==2?'g':s==3?'r':''}" onclick="setSt(${o.id},${s})">${ST[s]}</button>`).join('')}<button class="btn s" onclick="setSt(${o.id},0)">Reset</button></div>`:''}</div>`}
function pubList(){const mk=o=>({no:o.no,nama:mask(o.nama),svc:o.svc,jml:o.jml,st:o.st,p:o.prod?1:0,t:o.t});let L=LIVE?feed.filter(f=>f.no):[];const have=new Set(L.map(f=>f.no));db.orders.forEach(o=>{if(!have.has(o.no))L.push(mk(o))});return L.sort((a,b)=>b.t-a.t)}
function qRows(q){q=(q||'').trim().toUpperCase();const mine=new Map(db.orders.map(o=>[o.no,o]));let L=pubList();if(q)L=L.filter(f=>String(f.no).includes(q));
return L.map(f=>{const o=mine.get(f.no),st=o?o.st:(f.st||0);return `<div class="qx ${o?'mine':''} ${hl==f.no?'hl':''}" ${o?`onclick="goMine('${esc(f.no)}')"`:''}><div class="qn">${esc(f.no)}</div><div class="qi"><b>${esc(f.nama)}</b>${o?' <span class="you">PESANAN KAMU</span>':''}<small>${esc(f.svc)}${f.p?'':' · '+kfmt(Number(f.jml)||0)}</small></div><div class="qs"><span class="badge b${st}">${ST[st]}</span><small>${ago(f.t)}</small></div></div>`}).join('')||'<p class="note">Belum ada antrian</p>'}
function queue(){return `<h2 class="sec" style="margin-top:6px">🌐 Antrian Publik</h2><p>Semua pesanan yang masuk. Tap pesananmu untuk ke Antrian Saya.</p><input id="qs" placeholder="🔎 Cari nomor antrian, mis. A0001" oninput="updQueue()"><div id="ql">${qRows('')}</div>`}
function updQueue(){const l=$('#ql');if(l)l.innerHTML=qRows($('#qs')?$('#qs').value:'')}
function goMine(no){hl=no;tab='mine';render();setTimeout(()=>{const e=document.getElementById('ord-'+no);if(e)e.scrollIntoView({behavior:'smooth',block:'center'})},60);setTimeout(()=>{hl='';const e=document.getElementById('ord-'+no);if(e)e.classList.remove('hl')},4000)}
function mCard(o){const st=o.st,steps=['Masuk','Proses','Selesai'],cur=st==3?-1:st==0?0:st==1?1:2;
return `<div class="mc ${hl==o.no?'hl':''}" id="ord-${esc(o.no)}"><div class="mh"><div><small>No. Antrian</small><div class="q">${esc(o.no)}</div></div><span class="badge b${st}">${ST[st]}</span></div>
<div class="ms"><b>${esc(o.svc)}</b><small>${o.prod?'':kfmt(o.jml)+' · '}${rp(o.total)}</small></div>
${st==3?'<div class="rej">❌ Pesanan ditolak. Hubungi Customer lewat tombol 💬 untuk bantuan.</div>':`<div class="stp">${steps.map((t,i)=>`<div class="sp ${i<=cur?'d':''} ${i<cur?'c':''}"><i>${i<cur||st==2?'✓':i+1}</i><span>${t}</span></div>`).join('')}</div>`}
<small class="mt">🔗 ${esc(o.link)}<br>🕒 ${new Date(o.t).toLocaleString('id-ID')}</small></div>`}
function mine(){const L=db.orders.filter(o=>o.uid==uid).slice().reverse();
return `<h2 class="sec" style="margin-top:6px">📋 Antrian Saya</h2><p>Pantau status pesananmu di sini.</p>`+(L.length?L.map(mCard).join(''):`<div class="empty">📭<p>Kamu belum punya pesanan.</p><button class="btn" onclick="tab='home';render()">Pesan Sekarang</button></div>`)}
function cp(id){const o=db.orders.find(x=>x.id==id);navigator.clipboard.writeText(o.link).then(()=>toast('Tautan disalin'),()=>{prompt('Salin:',o.link)})}
function setSt(id,s){if(LIVE){fs.doc('feed/'+id).set({st:s},{merge:true}).catch(()=>{})}if(LIVE)return fs.doc('orders/'+id).update({st:s}).catch(e=>toast('Gagal: '+(e.code||e.message)));db.orders.find(x=>x.id==id).st=s;save();render()}
function showBukti(id){const o=db.orders.find(x=>x.id==id);modal=`<div class="ov"><div class="md"><img class="qr" style="max-width:100%" src="${esc(o.bukti)}"><br><button class="btn s" onclick="modal='';render()">Tutup</button></div></div>`;render()}
function msgs(list,me){return list.map(m=>`<div class="m ${m.from==me?'me':'ot'}">${esc(m.text)}${m.img?`<img src="${esc(m.img)}">`:''}<div class="tm">${new Date(m.t).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})}</div></div>`).join('')||'<p class="note">Belum ada pesan</p>'}
function cs(){return `<h2>💬 Customer Service</h2><p class="note" style="text-align:left;margin:6px 0 12px">Ada masalah? Kirim pesan + foto, admin akan membalas. Riwayat chat tersimpan di akun kamu (ID: ${esc(String(uid).slice(-5).toUpperCase())}). Buka web ini di browser yang sama.</p>
<div class="chat" id="cm">${msgs(db.chats.filter(m=>m.uid==uid),'b')}</div>${chatBox('b')}`}
function chatBox(me){return `<div id="pv">${pimg?`<div class="m me" style="margin:0 0 8px">Foto siap dikirim<img src="${esc(pimg)}" style="max-width:120px"></div>`:''}</div><input id="ct" placeholder="Tulis pesan..." onkeydown="if(event.key==='Enter'){event.preventDefault();send('${me}')}">
<div class="row"><button type="button" class="btn s" style="margin:0" onclick="document.getElementById('cf').click()">📷 Foto</button><input id="cf" type="file" accept="image/*" onchange="pick(this)" style="position:absolute;left:-9999px;top:0;width:1px;height:1px;opacity:0"><button type="button" class="btn" style="flex:1;width:auto" onclick="send('${me}')">Kirim ➤</button></div>`}
function pick(el){const f=el.files&&el.files[0];if(!f)return;img(f,d=>{pimg=d;$('#pv').innerHTML=`<div class="m me" style="margin:0 0 8px">Foto siap dikirim<img src="${d}" style="max-width:120px"></div>`;toast('Foto terpilih')});el.value=''}
function send(me){try{
const ct=$('#ct'),t=ct.value.trim();
if(!t&&!pimg)return toast('Tulis pesan atau pilih foto');
const u=me=='b'?uid:thread;if(!u)return toast('Pilih chat dulu');
const msg={uid:u,from:me,text:t,img:pimg,t:Date.now()};
if(LIVE)fs.collection('chats').add(msg).catch(e=>toast('Gagal kirim: '+(e.code||e.message)));
else{db.chats.push(msg);save();const m=$('#cm');m.innerHTML=msgs(db.chats.filter(x=>x.uid==u),me);m.scrollTop=m.scrollHeight}
pimg='';ct.value='';$('#pv').innerHTML='';toast('Terkirim')}catch(e){toast('Gagal kirim: '+e.message)}}
function loginView(){$('#app').innerHTML=`<div class="hero"><div class="logo" style="font-size:30px">⚡ ADMIN LOGIN</div></div><div class="card">${LIVE?'<label>Email admin</label><input id="em" type="email">':''}<label>Password</label><input id="pw" type="password"><button class="btn" onclick="login()">Masuk</button><br><br><a href="#admin" style="color:var(--gold);font-size:13px" onclick="forgot();return false">Lupa password? Reset</a></div>`}
const pw=()=>{try{return localStorage.getItem('se_pw')||ADMIN_PW}catch(e){return ADMIN_PW}};
function forgot(){if(LIVE){const e=(($('#em')||{}).value||ADMIN_EMAIL).trim();if(!e)return toast('Isi email admin dulu');au.sendPasswordResetEmail(e).then(()=>toast('Link reset dikirim ke email admin'),x=>toast('Gagal: '+(x.code||x.message)))}else toast('Mode lokal: pakai password bawaan di kode (ADMIN_PW)')}
function chpw(){const n=$('#np').value;if(n.length<6)return toast('Minimal 6 karakter');if(LIVE){au.currentUser.updatePassword(n).then(()=>{toast('Password diganti');$('#np').value=''},e=>toast(e.code=='auth/requires-recent-login'?'Keluar lalu login ulang, coba lagi':'Gagal: '+(e.code||e.message)))}else{if($('#op').value!==pw())return toast('Password lama salah');try{localStorage.setItem('se_pw',n)}catch(e){}toast('Password diganti');$('#np').value=$('#op').value=''}}
function login(){if(LIVE){au.signInWithEmailAndPassword($('#em').value.trim(),$('#pw').value).then(u=>{if((u.user.email||'').toLowerCase()!==ADMIN_EMAIL.toLowerCase())toast('Email ini bukan admin')},e=>toast('Login gagal: '+(e.code||e.message)));return}if($('#pw').value==pw()){isAdmin=true;try{sessionStorage.setItem('se_admin','1')}catch(e){}render()}else toast('Password salah')}
function pickQr(el){const f=el.files&&el.files[0];if(!f)return;img(f,d=>{pq=d;render();toast('Foto QR dipilih. Tekan Konfirmasi & Simpan')},900,.9);el.value=''}
function saveQr(){if(!pq)return;const d=pq;pq='';setQris(d)}
function adminView(){
const c=[0,1,2,3].map(s=>db.orders.filter(o=>o.st==s).length);
let body='';
if(adminTab=='orders')body=db.orders.slice().reverse().map(o=>oCard(o,1)).join('')||'<p class="note">Belum ada pesanan</p>';
else if(adminTab=='chat'){const us=[...new Set(db.chats.map(m=>m.uid))];
const nm=u=>{const o=db.orders.find(x=>x.uid==u);return o?o.nama:'Pembeli '+u.slice(-4)};
body=`<div class="row" style="margin-bottom:12px"><h2>💬 Customer</h2>${us.length?'<button class="btn s r" onclick="delChat(null)">🗑 Hapus Semua Chat</button>':''}</div>`+us.map(u=>`<div class="thread ${thread==u?'on':''}" onclick="thread='${esc(u)}';render()">👤 ${esc(nm(u))}</div>`).join('')||'<p class="note">Belum ada chat</p>';
if(thread)body+=`<button class="btn s r" style="margin-bottom:10px" onclick="delChat(thread)">🗑 Hapus Chat Ini</button><div class="chat" id="cm">${msgs(db.chats.filter(m=>m.uid==thread),'a')}</div>${chatBox('a')}`}
else if(adminTab=='link')body=`<div class="card"><h3>${lf.id?'✏️ Edit Link':'➕ Simpan Link'}</h3><br><label>Nama (bebas, mis. Saluran WA Saya, TikTok Saya, IG Saya, Nomor HP)</label><input id="ln" maxlength="60" value="${esc(lf.name)}" oninput="lf.name=this.value"><label>Isi (link atau nomor)</label><input id="lu" value="${esc(lf.url)}" placeholder="https://... atau 08xxxxxxxxxx" oninput="lf.url=this.value"><button class="btn g" onclick="saveLink()">✅ ${lf.id?'Simpan Perubahan':'Simpan Link'}</button>${lf.id?'<br><br><button class="btn s" onclick="lf=blankLf();render()">Batal Edit</button>':''}</div><h3 style="margin:18px 0 8px">Link Tersimpan (${db.links.length})</h3>`+(db.links.map(l=>`<div class="lk2" style="cursor:default"><div class="tile" style="margin:0;flex:none;width:48px;height:48px;font-size:24px;background:var(--hot)">${linkIc(l.name,l.url)}</div><div class="lt"><b>${esc(l.name)}</b><small>${esc(l.url)}</small></div><div style="display:flex;flex-direction:column;gap:6px"><button class="btn s" onclick="editLink('${esc(l.id)}')">✏️ Edit</button><button class="btn s r" onclick="delLink('${esc(l.id)}')">🗑 Hapus</button></div></div>`).join('')||'<p class="note">Belum ada link</p>');
else if(adminTab=='prod')body=`<div class="card"><h3>${pf.id?'✏️ Edit Produk':'➕ Tambah Produk'}</h3><br><label>Nama produk</label><input id="pn" maxlength="60" value="${esc(pf.name)}" oninput="pf.name=this.value"><label>Deskripsi</label><textarea id="pd" rows="3" maxlength="300" oninput="pf.desc=this.value">${esc(pf.desc)}</textarea><label>Harga (Rp)</label><input id="pr" type="number" inputmode="numeric" value="${esc(pf.price)}" oninput="pf.price=this.value"><label>Foto produk</label><input type="file" accept="image/*" onchange="pickProdImg(this)">${pf.img?`<img class="qr" style="max-width:200px" src="${esc(pf.img)}">`:''}<button class="btn g" onclick="saveProd()">✅ ${pf.id?'Simpan Perubahan':'Tambah Produk'}</button>${pf.id?'<br><br><button class="btn s" onclick="pf=blankPf();render()">Batal Edit</button>':''}</div><h3 style="margin:18px 0 8px">Daftar Produk (${db.products.length})</h3>`+(db.products.map(p=>`<div class="card o"><div class="row" style="flex-wrap:nowrap">${p.img?`<img src="${esc(p.img)}" style="width:64px;height:64px;object-fit:cover;border-radius:12px">`:'<div class="tile" style="margin:0">🛍️</div>'}<div style="flex:1;min-width:0"><b>${esc(p.name)}</b><br><small>${rp(p.price)}</small></div></div><div class="row" style="margin-top:10px"><button class="btn s" onclick="editProd('${esc(p.id)}')">✏️ Edit</button><button class="btn s r" onclick="delProd('${esc(p.id)}')">🗑 Hapus</button></div></div>`).join('')||'<p class="note">Belum ada produk</p>');
else body=`<div class="card"><label>Upload QR pembayaran (QRIS)</label><input type="file" accept="image/*" onchange="pickQr(this)">${pq?`<p class="note" style="margin:0">Pratinjau QR baru (belum disimpan)</p><img class="qr" src="${esc(pq)}"><button class="btn g" onclick="saveQr()">✅ Konfirmasi & Simpan QR</button><br><br><button class="btn s" onclick="pq='';render()">Batal</button><br><br>`:''}${db.qris?`<label>QR aktif saat ini (yang dilihat pembeli)</label><img class="qr" src="${esc(db.qris)}">`:'<p class="note">Belum ada QR aktif</p>'}<br><label>Ganti password</label>${LIVE?'':'<input id="op" type="password" placeholder="Password lama">'}<input id="np" type="password" placeholder="Password baru (min 6)"><button class="btn" onclick="chpw()">Simpan Password</button><br><br><button class="btn s r" onclick="logout()">Keluar</button></div>`;
$('#app').innerHTML=`<header><div class="logo">⚡ ADMIN PANEL</div><span class="badge b2">DILZZ SUNTIK ELITE</span></header>
${LIVE?'':'<p class="note" style="margin-bottom:10px">⚠️ Mode lokal: data belum online. Isi FIREBASE_CONFIG supaya pesanan dari semua orang masuk ke sini.</p>'}<div class="stats"><div><b>${c[0]}</b><small>Belum</small></div><div><b>${c[1]}</b><small>Proses</small></div><div><b>${c[2]}</b><small>Berhasil</small></div><div><b>${c[3]}</b><small>Ditolak</small></div></div>
<div class="tabs">${[['orders','Pesanan'],['prod','Produk'],['link','Link'],['set','Pengaturan']].map(([k,l])=>`<button class="${adminTab==k?'on':''}" onclick="adminTab='${k}';render()">${l}</button>`).join('')}</div>${body}${modal}${adminTab!='chat'?'<button class="fab a" onclick="goChat()">💬</button>':''}`;
const ch=$('.chat');if(ch)ch.scrollTop=1e9}
function produk(){const L=db.products||[];return `<button class="btn s" onclick="tab='home';render()">← Kembali</button><h2 class="sec" style="margin-top:12px">🛍️ Produk</h2><p>Pilih produk lalu bayar lewat QRIS.</p><div class="grid">${L.map(p=>`<div class="card pc">${p.img?`<img class="pi" src="${esc(p.img)}" alt="">`:'<div class="pi ph">🛍️</div>'}<h3>${esc(p.name)}</h3><p>${esc(p.desc)}</p><div class="price"><b>${rp(p.price)}</b></div><button class="btn" onclick="openProd('${esc(p.id)}')">Beli</button></div>`).join('')}</div>${L.length?'':'<div class="empty">🛍️<p>Belum ada produk.</p></div>'}`}
function openProd(id){const p=db.products.find(x=>x.id==id);if(!p)return;modal=`<div class="ov"><div class="md">${p.img?`<img class="pi" src="${esc(p.img)}">`:''}<h2>${esc(p.name)}</h2><p class="note" style="text-align:left;margin:6px 0 12px">${esc(p.desc)}</p><div class="tot">${rp(p.price)}</div><label>Nama</label><input id="nm" placeholder="Nama kamu"><label>Kontak / Catatan</label><input id="lk" placeholder="No. WhatsApp atau catatan"><button class="btn" onclick="toPayProd('${esc(p.id)}')">Konfirmasi</button><br><br><button class="btn s" onclick="modal='';render()">Batal</button></div></div>`;render()}
function toPayProd(id){const p=db.products.find(x=>x.id==id),nm=$('#nm').value.trim(),lk=$('#lk').value.trim();if(!p)return toast('Produk tidak ditemukan');if(!nm)return toast('Nama wajib diisi');if(!lk)return toast('Kontak / catatan wajib diisi');
draft={prod:1,sid:p.id,svc:p.name,fid:'-',modal:0,jml:1,total:p.price,nama:nm,link:lk,bukti:''};modal=payModal();render()}
function readPf(){if($('#pn')){pf.name=$('#pn').value;pf.desc=$('#pd').value;pf.price=$('#pr').value}}
function pickProdImg(el){const f=el.files&&el.files[0];if(!f)return;readPf();img(f,d=>{pf.img=d;render();toast('Foto dipilih')},600,.75);el.value=''}
function editProd(id){const p=db.products.find(x=>x.id==id);if(!p)return;pf={id:p.id,name:p.name,desc:p.desc||'',price:String(p.price),img:p.img||''};render();window.scrollTo(0,0)}
async function saveProd(){readPf();const name=pf.name.trim(),price=Math.floor(+pf.price);if(!name)return toast('Nama produk wajib diisi');if(!price||price<1)return toast('Harga wajib diisi');
const old=db.products.find(x=>x.id==pf.id),p={id:pf.id||('p'+Date.now().toString(36)),name,desc:pf.desc.trim(),price,img:pf.img||'',t:(old&&old.t)||Date.now()};
if(LIVE){try{await fs.collection('products').doc(p.id).set(p)}catch(e){return toast('Gagal simpan: '+(e.code||e.message))}}
else{const i=db.products.findIndex(x=>x.id==p.id);if(i>=0)db.products[i]=p;else db.products.push(p);db.products.sort((a,b)=>b.t-a.t);save()}
pf=blankPf();toast('✅ Produk tersimpan');render()}
async function delProd(id){if(!confirm('Hapus produk ini?'))return;if(LIVE){try{await fs.collection('products').doc(id).delete()}catch(e){return toast('Gagal hapus: '+(e.code||e.message))}}else{db.products=db.products.filter(x=>x.id!=id);save()}toast('🗑 Produk dihapus');render()}
const linkHref=u=>{u=String(u||'').trim();if(/^https?:\/\/\S+$/i.test(u))return u;if(/^[+0-9][0-9\s\-+]{7,}$/.test(u)){let d=u.replace(/[^0-9]/g,'');if(d.startsWith('0'))d='62'+d.slice(1);return 'https://wa.me/'+d}if(/^[\w-]+(\.[\w-]+)+(\/\S*)?$/.test(u))return 'https://'+u;return ''};
const linkIc=(n,u)=>{const t=(String(n)+' '+String(u)).toLowerCase();return /tiktok/.test(t)?'🎵':/instagram|\big\b/.test(t)?'📸':/saluran|channel/.test(t)?'📢':(/wa\.me|whatsapp|nope|\bhp\b|telp|\bwa\b/.test(t)||/^[+0-9][0-9\s\-+]{7,}$/.test(String(u).trim()))?'📱':'🔗'};
function linksHtml(){const L=db.links||[];if(!L.length)return '';return `<div class="lbl">LINK KAMI</div>`+L.map((l,i)=>{const h=linkHref(l.url),T=h?`a class="lk2" href="${esc(h)}" target="_blank" rel="noopener"`:'div class="lk2"';return `<${T}><div class="tile" style="margin:0;flex:none;width:48px;height:48px;font-size:24px;background:var(--hot)">${linkIc(l.name,l.url)}</div><div class="lt"><b>${esc(l.name)}</b><small>${esc(l.url)}</small></div><span class="cpb" onclick="event.preventDefault();event.stopPropagation();cpl(${i})">Salin</span></${h?'a':'div'}>`}).join('')}
function cpl(i){const l=(db.links||[])[i];if(!l)return;navigator.clipboard.writeText(l.url).then(()=>toast('Disalin'),()=>{prompt('Salin:',l.url)})}
function readLf(){if($('#ln')){lf.name=$('#ln').value;lf.url=$('#lu').value}}
function editLink(id){const l=db.links.find(x=>x.id==id);if(!l)return;lf={id:l.id,name:l.name,url:l.url};render();window.scrollTo(0,0)}
async function saveLink(){readLf();const name=lf.name.trim(),url=lf.url.trim();if(!name)return toast('Nama wajib diisi');if(!url)return toast('Isi link wajib diisi');
const old=db.links.find(x=>x.id==lf.id),l={id:lf.id||('l'+Date.now().toString(36)),name,url,t:(old&&old.t)||Date.now()};
if(LIVE){try{await fs.collection('links').doc(l.id).set(l)}catch(e){return toast('Gagal simpan: '+(e.code||e.message))}}
else{const i=db.links.findIndex(x=>x.id==l.id);if(i>=0)db.links[i]=l;else db.links.push(l);save()}
lf=blankLf();toast('✅ Link tersimpan');render()}
async function delLink(id){if(!confirm('Hapus link ini?'))return;if(LIVE){try{await fs.collection('links').doc(id).delete()}catch(e){return toast('Gagal hapus: '+(e.code||e.message))}}else{db.links=db.links.filter(x=>x.id!=id);save()}toast('🗑 Link dihapus');render()}
function goChat(){adminTab='chat';render()}
async function delChat(u){if(!confirm(u?'Hapus semua pesan di chat ini?':'Hapus SEMUA chat dari semua pembeli?'))return;
if(u===thread&&u)thread=null;
if(LIVE){try{const ids=db.chats.filter(m=>!u||m.uid==u).map(m=>m._id).filter(Boolean);for(let i=0;i<ids.length;i+=400){const b=fs.batch();ids.slice(i,i+400).forEach(id=>b.delete(fs.collection('chats').doc(id)));await b.commit()}toast('🗑 Chat dihapus')}catch(e){toast('Gagal hapus: '+(e.code||e.message))}}
else{db.chats=db.chats.filter(m=>u&&m.uid!=u);save();toast('🗑 Chat dihapus');render()}}
function logout(){if(LIVE){au.signOut();location.hash='';return}isAdmin=false;try{sessionStorage.removeItem('se_admin')}catch(e){}location.hash='';render()}
function setQris(d){db.qris=d;save();if(LIVE)fs.doc('settings/main').set({qris:d}).then(()=>toast('✅ QR tersimpan, pembeli sudah bisa lihat'),e=>toast('Gagal simpan QR: '+(e.code||e.message)));else toast('QR tersimpan');render()}
function refresh(){const a=document.activeElement,typing=a&&(a.tagName=='INPUT'||a.tagName=='TEXTAREA');
const m=$('#cm');if(m){const u=isAdm()?thread:uid;m.innerHTML=msgs(db.chats.filter(x=>x.uid==u),isAdm()?'a':'b');m.scrollTop=m.scrollHeight}
const qb=$('#qrbox');if(qb)qb.innerHTML=qrHtml();
if(!typing&&!modal&&!pimg&&!pq&&!(isAdm()&&adminTab=='prod'&&pfDirty())&&!(isAdm()&&adminTab=='link'&&lfDirty()))render()}
function listen(){unsubs.forEach(f=>f());unsubs=[];seen=false;
const oc=isAdmin?fs.collection('orders'):fs.collection('orders').where('uid','==',uid);
const cc=isAdmin?fs.collection('chats'):fs.collection('chats').where('uid','==',uid);
unsubs.push(fs.doc('settings/main').onSnapshot(d=>{db.qris=(d.data()||{}).qris||'';refresh()},e=>toast('QR gagal dimuat: '+(e.code||e.message))));
unsubs.push(oc.onSnapshot(q=>{db.orders=q.docs.map(d=>d.data()).sort((x,y)=>x.id-y.id);if(isAdmin&&seen&&q.docChanges().some(c=>c.type=='added'))toast('🔔 Pesanan baru masuk!');seen=true;refresh()},e=>toast('Gagal ambil pesanan: '+e.code)));
unsubs.push(cc.onSnapshot(q=>{db.chats=q.docs.map(d=>({...d.data(),_id:d.id})).sort((x,y)=>x.t-y.t);refresh()},e=>toast('Gagal ambil chat: '+e.code)));
unsubs.push(fs.collection('feed').orderBy('t','desc').limit(40).onSnapshot(q=>{feed=q.docs.map(d=>d.data());updTick();updQueue()},()=>{}));
unsubs.push(fs.collection('products').onSnapshot(q=>{db.products=q.docs.map(d=>d.data()).sort((a,b)=>b.t-a.t);refresh()},e=>toast('Gagal ambil produk: '+(e.code||e.message))));
unsubs.push(fs.collection('links').onSnapshot(q=>{db.links=q.docs.map(d=>d.data()).sort((a,b)=>a.t-b.t);refresh()},e=>toast('Gagal ambil link: '+(e.code||e.message))))}
function initFB(){firebase.initializeApp(FIREBASE_CONFIG);au=firebase.auth();fs=firebase.firestore();
try{fs.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}
au.onAuthStateChanged(u=>{if(!u){au.signInAnonymously().catch(e=>{ready=true;toast('Gagal konek: '+(e.code||e.message));render()});return}
uid=u.uid;try{localStorage.setItem('se_uid',uid)}catch(e){}
isAdmin=!u.isAnonymous&&!!u.email&&!!ADMIN_EMAIL&&u.email.toLowerCase()===ADMIN_EMAIL.toLowerCase();ready=true;listen();render()})}

// Notifikasi pembelian (nama disamarkan: 3 huruf pertama + ***)
let feed=[],feedI=0,feedOk=false;
const mask=n=>(String(n||'').trim().split(/\s+/)[0]||'Seseorang').slice(0,3)+'***';
const ago=t=>{const m=Math.floor((Date.now()-t)/6e4);return m<1?'baru saja':m<60?m+' menit lalu':m<1440?Math.floor(m/60)+' jam lalu':Math.floor(m/1440)+' hari lalu'};
function showSale(f){if(isAdm()||document.hidden||!f)return;document.querySelectorAll('.sale').forEach(e=>e.remove());const e=document.createElement('div');e.className='sale';e.innerHTML=`<div class="si">🛒</div><div><b>${esc(f.nama)}</b> membeli<br><span>${Number(f.jml)} ${esc(f.svc)}</span><small>${ago(f.t)}</small></div>`;document.body.appendChild(e);setTimeout(()=>e.classList.add('out'),5000);setTimeout(()=>e.remove(),5600)}
const kfmt=n=>n>=1000?(n/1000).toFixed(n%1000?1:0).replace('.',',')+'k':String(n);
function tickHtml(){const L=pubList().slice(0,15);
let a=L.length?L.map(f=>`<span class="ti">🛒 <b>${esc(f.nama)}</b> ${f.p?'beli':'suntik'} ${esc(String(f.svc).replace(/^suntik\s+/i,''))}${f.p?'':' <em>'+kfmt(Number(f.jml)||0)+'</em>'}</span>`):['<span class="ti">🚀 Jadilah pembeli pertama hari ini!</span>','<span class="ti">⚡ Proses cepat</span>','<span class="ti">🔒 Aman &amp; terpercaya</span>'];
while(a.length<8)a=a.concat(a);return a.join('')+a.join('')}
function updTick(){const t=$('#trk');if(!t)return;const h=tickHtml();if(t.dataset.h===h)return;t.dataset.h=h;t.innerHTML=h;t.style.animationDuration=Math.max(20,t.children.length*2)+'s'}
if(LIVE){try{initFB()}catch(e){ready=true;toast('Firebase error: '+e.message);render()}}else render();
</script></body></html>
